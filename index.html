<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>SPAN - Students for Patient Advocacy Nationwide</title>

   <!-- Google Tag Manager (kept async) -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-7QY6SHLJDL"></script>
   <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-7QY6SHLJDL');
   </script>

   <!-- SEO -->
   <link rel="sitemap" type="application/xml" title="Sitemap" href="https://spanationwide/sitemap.xml" />
   <script type="application/ld+json">
      {
         "@context": "https://schema.org",
         "@type": "Organization",
         "name": "SPAN - Students for Patient Advocacy Nationwide",
         "url": "https://spanationwide.org",
         "logo": "https://spanationwide.org/assets/images/index/logo-icon-dark.svg",
         "sameAs": [
            "https://www.linkedin.com/company/spanationwide/",
            "https://www.instagram.com/spanationwide/"
         ]
      }
   </script>

   <!-- Critical CSS - Bootstrap (render-blocking for initial layout) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
   
   <!-- Non-critical CSS - Load asynchronously -->
   <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
   <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></noscript>
   
   <link rel="preload" href="https://unpkg.com/aos@2.3.1/dist/aos.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
   <noscript><link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"></noscript>

   <!-- Favicon & canonical + social tags -->
   <link rel="icon" type="image/svg+xml" href="/assets/images/index/logo-icon-dark.ico" media="(prefers-color-scheme: light)">
   <link rel="icon" type="image/svg+xml" href="/assets/images/index/logo-icon-light.ico" media="(prefers-color-scheme: dark)">
   <link rel="canonical" href="https://spanationwide.org">
   <meta name="robots" content="index, follow">
   <meta property="og:type" content="website">
   <meta property="og:title" content="SPAN - Students for Patient Advocacy Nationwide">
   <meta property="og:description" content="Empowering the next generation of healthcare advocates.">
   <meta property="og:image" content="/assets/images/index/preview.jpg">
   <meta property="og:url" content="https://spanationwide.org">
   <meta property="og:site_name" content="SPAN">
   <meta name="twitter:title" content="SPAN - Students for Patient Advocacy Nationwide">
   <meta name="twitter:description" content="Empowering the next generation of healthcare advocates.">
   <meta name="twitter:image" content="/assets/images/index/preview.jpg">
   <meta name="twitter:site" content="@spanationwide">
   <meta name="twitter:creator" content="@spanationwide">

   <!-- Google Charts loader (kept so map.js can use it). non-blocking via defer. -->
   <script defer src="https://www.gstatic.com/charts/loader.js"></script>

   <!-- React app entry point - Vite will process this and inject built assets -->
   <script type="module" src="/src/main.jsx"></script>
</head>

<body>
   <nav id="navbarContainer" class="navbar navbar-expand-lg navbar-dark sticky-top"></nav>

   <!-- React app will mount here -->
   <div id="home-root"></div>

   <footer id="footerContainer" class="footer text-white py-5"></footer>

   <!-- Team Bio Modal -->
   <div class="modal fade" id="bioModal" tabindex="-1" aria-labelledby="bioModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-md">
         <div class="modal-content border-0 shadow-sm rounded-4">
            <div class="modal-body p-4">
               <button type="button" class="btn-close float-end" data-bs-dismiss="modal" aria-label="Close"></button>
               <div class="text-center mb-3">
                  <img id="bioModalImage" src="#" alt="Team Member" class="rounded-circle mb-3" width="100" height="100">
                  <h5 class="mb-1" id="bioModalLabel"></h5>
                  <p class="text-muted small mb-0" id="bioModalSubLabel"></p>
               </div>
               <hr class="my-3">
               <div id="bioModalBody" class="text-start small" style="line-height: 1.6;">
               </div>
               <div class="text-end mt-4">
                  <a id="bioModalEmail" href="#" class="btn btn-outline-dark btn-sm">
                     <i class="bi bi-envelope"></i> Email
                  </a>
               </div>
            </div>
         </div>
      </div>
   </div>

   <!-- SCRIPTS - defer so parsing isn't blocked. Keep order important: bootstrap -> navbar -> module app scripts -> footer -->
   <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
   <script defer src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


   <!-- React app entry point for bills preview -->

   <!-- Initialize AOS after DOM is ready and the library has been parsed -->
   <script>
      document.addEventListener('DOMContentLoaded', function () {
         if (window.AOS && typeof AOS.init === 'function') {
            AOS.init();
         }
      });
   </script>
   <div class="modal fade" id="collaboratorModal" tabindex="-1" aria-labelledby="collaboratorModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="collaboratorModalLabel">Collaborators</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="collaboratorModalBody">
        <!-- Collaborators info inserted here -->
      </div>
    </div>
  </div>
</div>
</body>

</html>
