         <h1>Our Story | Students for Patient Advocacy Nationwide (SPAN)</h1>
         <p>SPAN is a student-powered healthcare advocacy organization founded in 2025 after Texas House Bill 5294 threatened pass/fail grading at Texas medical schools. Student advocates from schools including UTMB and Baylor College of Medicine helped stop the bill.</p>
         <p>SPAN trains students to research legislation, draft policy, testify, and engage lawmakers. We have engaged 1,500+ officials and publish work on <a href="https://spanationwide.org/blog.html">our blog</a> and track bills at <a href="https://spanationwide.org/bills.html">spanationwide.org/bills.html</a>.</p>
         <p>Students can get involved by applying at <a href="https://spanationwide.org/#join">spanationwide.org</a>.</p>
